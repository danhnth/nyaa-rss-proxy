name: fetch-nyaa
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-nyaa
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_nyaa.py
      - run: |
          git config user.name "nyaa-bot"
          git config user.email "nyaa-bot@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || (git commit -m "update feed $(date -u +%FT%TZ)" && git push)
